name: Validate provisional System 1 v5
on: [push, pull_request, workflow_dispatch]
jobs:
  v5-offline-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python3 scripts/validate_system1_v5_provisional_2026_11_09.py results/releases/system1_v5_provisional_2026-11-09 results/releases/system1_v4_openai_2026-11-06
      - run: python3 scripts/validate_system1_v5_hosted_2026_11_09.py results/releases/system1_v5_hosted_2026-11-09 results/releases/system1_v5_provisional_2026-11-09
      - run: python3 scripts/validate_system1_v5_drex_2026_11_09.py results/releases/system1_v5_drex_2026-11-09 results/releases/system1_v5_hosted_2026-11-09
      - run: python3 scripts/validate_system1_v5_singvl_2026_11_11.py results/releases/system1_v5_singvl_2026-11-11 results/releases/system1_v5_drex_2026-11-09
      - run: python3 scripts/validate_system1_v5_d3_flash_2026_11_11.py results/releases/system1_v5_d3_flash_2026-11-11 results/releases/system1_v5_singvl_2026-11-11
      - run: python3 scripts/validate_system1_v5_gemini_decision1_2026_11_13.py results/releases/system1_v5_gemini_decision1_2026-11-13 results/releases/system1_v5_d3_flash_2026-11-11
      - run: python3 scripts/validate_system1_v5_hosted_refresh_2026_11_13.py results/releases/system1_v5_hosted_refresh_2026-11-13 results/releases/system1_v5_gemini_decision1_2026-11-13
      - run: python3 scripts/validate_system1_v5_asus_native_2026_11_13.py results/releases/system1_v5_asus_native_2026-11-13 results/releases/system1_v5_hosted_refresh_2026-11-13 --mirror docs/v5

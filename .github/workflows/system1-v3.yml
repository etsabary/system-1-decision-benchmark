name: Validate System 1 v3
on: [push, pull_request, workflow_dispatch]
jobs:
  v3-offline-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python3 scripts/validate_system1_v3.py results/releases/system1_v3_2026-11-01 results/releases/system1_v2_presentation_2026-11-01
      - run: python3 scripts/validate_system1_v3.py results/releases/system1_v3_presentation_2026-11-01 results/releases/system1_v2_presentation_2026-11-01
      - run: python3 scripts/validate_system1_v3_presentation.py results/releases/system1_v3_presentation_2026-11-01
      - run: python3 -m unittest discover -s scripts -p "test_system1_v3_presentation.py"
      - run: diff -qr docs/v3 results/releases/system1_v3_presentation_2026-11-01

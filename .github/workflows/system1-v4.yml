name: Validate System 1 v4
on: [push, pull_request, workflow_dispatch]
jobs:
  v4-offline-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python3 scripts/validate_system1_v4.py results/releases/system1_v4_2026-11-02 results/releases/system1_v3_presentation_2026-11-01
      - run: python3 scripts/validate_system1_v4_presentation.py results/releases/system1_v4_2026-11-02
      - run: python3 scripts/validate_system1_v4_hosted.py results/releases/system1_v4_hosted_2026-11-02 results/releases/system1_v4_2026-11-02
      - run: python3 scripts/validate_system1_v4_presentation.py results/releases/system1_v4_hosted_2026-11-02
      - run: python3 scripts/validate_system1_v4_kai_note.py results/releases/system1_v4_kai_note_2026-11-02 results/releases/system1_v4_hosted_2026-11-02
      - run: python3 scripts/validate_system1_v4_hosted.py results/releases/system1_v4_kai_note_2026-11-02 results/releases/system1_v4_2026-11-02
      - run: python3 scripts/validate_system1_v4_presentation.py results/releases/system1_v4_kai_note_2026-11-02
      - run: python3 scripts/validate_system1_v4_hosted.py results/releases/system1_v4_sage_2026-11-02 results/releases/system1_v4_2026-11-02
      - run: python3 scripts/validate_system1_v4_presentation.py results/releases/system1_v4_sage_2026-11-02
      - run: python3 scripts/validate_system1_v4_sage.py results/releases/system1_v4_sage_2026-11-02 results/releases/system1_v4_kai_note_2026-11-02
      - run: python3 scripts/validate_system1_v4_hosted.py results/releases/system1_v4_local_screens_2026-11-02 results/releases/system1_v4_2026-11-02
      - run: python3 scripts/validate_system1_v4_presentation.py results/releases/system1_v4_local_screens_2026-11-02
      - run: python3 scripts/validate_system1_v4_local_screens.py results/releases/system1_v4_local_screens_2026-11-02 results/releases/system1_v4_sage_2026-11-02
      - run: python3 scripts/validate_system1_v4_hosted.py results/releases/system1_v4_strike_screen_2026-11-04 results/releases/system1_v4_2026-11-02
      - run: python3 scripts/validate_system1_v4_presentation.py results/releases/system1_v4_strike_screen_2026-11-04
      - run: python3 scripts/validate_system1_v4_strike_screen.py results/releases/system1_v4_strike_screen_2026-11-04 results/releases/system1_v4_local_screens_2026-11-02
      - run: python3 scripts/validate_system1_v4_hosted.py results/releases/system1_v4_new_local_screens_2026-11-04 results/releases/system1_v4_2026-11-02
      - run: python3 scripts/validate_system1_v4_presentation.py results/releases/system1_v4_new_local_screens_2026-11-04
      - run: python3 scripts/validate_system1_v4_new_local_screens.py results/releases/system1_v4_new_local_screens_2026-11-04 results/releases/system1_v4_strike_screen_2026-11-04
      - run: python3 scripts/validate_system1_v4_hosted.py results/releases/system1_v4_local_screens_curated_2026-11-04 results/releases/system1_v4_2026-11-02
      - run: python3 scripts/validate_system1_v4_presentation.py results/releases/system1_v4_local_screens_curated_2026-11-04
      - run: python3 scripts/validate_system1_v4_remove_h2o_e4b.py results/releases/system1_v4_local_screens_curated_2026-11-04 results/releases/system1_v4_new_local_screens_2026-11-04
      - run: diff -qr docs/v4 results/releases/system1_v4_local_screens_curated_2026-11-04
